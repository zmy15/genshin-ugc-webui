# pre-commit 配置
#
# 本地安装：pip install pre-commit && pre-commit install
# 全量跑一次：pre-commit run --all-files
#
# ★ 职责划分（重要）：
#   本文件只做「格式与卫生」类检查 —— 这些是 pre-commit 的强项，
#   且 pre-commit.ci 会自动修复 PR。
#
#   Lua 的语法与语义验证**不放这里**，全部交给 .github/workflows/tests.yml：
#     - 语法检查：luac5.3 -p（覆盖所有 .lua）
#     - 全量测试：34 个套件，在 Lua 5.3 下跑
#   原因：pre-commit 的 Lua 钩子在本机与普通 GitHub runner 上都要求
#   额外安装 luarocks（`language: lua` 会调用 `luarocks config`，
#   `language: script/unsupported` 则依赖 PATH 里有 lua）。
#   而 pre-commit.ci 的 runner 是独立容器、PATH 上没有 lua，
#   两边的环境假设不一致，容易产生"本地过、CI 挂"的假象。
#   统一交给 Actions 后，验证环境与实际游戏沙箱版本（5.3）一致，更可信。

repos:
  # ---------- 基础卫生检查（pre-commit 官方钩子）----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      # 末尾换行与行尾空白：仓库已在第一次接入时全量规范化过，
      # 之后只作用于本次改动涉及的文件。
      - id: end-of-file-fixer
      - id: trailing-whitespace
